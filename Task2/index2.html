<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Web Development</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Header -->
    <header class="header" id="home">
        <h1>Intermediate HTML, CSS & JavaScript</h1>
        <p>
            This webpage demonstrates HTML, CSS and JavaScript concepts
            including forms, validation, responsive layouts and DOM manipulation.
        </p>
    </header>

    <!-- Navigation -->
    <nav>
        <div class="logo">Task 2 - Web Development</div>

        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#todo">To-Do</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">

        <!-- Contact Form -->
        <div class="card" id="contact">

            <h2>Contact Form</h2>

            <form id="contactForm">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    rows="6"
                    placeholder="Enter your message"
                ></textarea>

                <button type="submit">Submit</button>

                <p id="error"></p>

            </form>

        </div>

        <!-- To-Do List -->
        <div class="card" id="todo">

            <h2>My To-Do List</h2>

            <div class="todo">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                >

                <button type="button" onclick="addTask()">
                    Add
                </button>

            </div>

            <ul id="taskList"></ul>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>2026 ApexPlanet Internship - Task 2</p>
    </footer>

    <script src="script1.js"></script>

</body>
</html>
